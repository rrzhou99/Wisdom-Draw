<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧籤 • 心靈法語</title>
  <style>
    :root {
      --primary-red: #b7282e;
      --primary-hover: #961f24;
      --btn-gray: #e2e8f0;
      --btn-gray-hover: #cbd5e1;
      --bg-cream: #faf7f2;
      --border-color: #e5dfd5;
      --text-dark: #2c2c2c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Noto Sans TC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .lang-switch {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      font-size: 0.95rem;
    }

    .lang-switch a {
      color: var(--primary-red);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed var(--primary-red);
      padding-bottom: 2px;
    }

    .lang-switch a:hover {
      opacity: 0.8;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      color: var(--primary-red);
      font-size: 1.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .control-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 480px;
    }

    input[type="number"] {
      width: 90px;
      padding: 0.65rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1.05rem;
      text-align: center;
      outline: none;
      background: #fff;
    }

    input[type="number"]:focus {
      border-color: var(--primary-red);
      box-shadow: 0 0 0 2px rgba(183, 40, 46, 0.15);
    }

    .btn {
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* 查詢籤號：紅色高亮主按鈕 */
    .btn-search {
      background: var(--primary-red);
      color: #fff;
      border: none;
      box-shadow: 0 3px 8px rgba(183, 40, 46, 0.25);
    }

    .btn-search:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    /* 隨機抽籤：灰色次要按鈕 */
    .btn-draw {
      background: var(--btn-gray);
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-draw:hover {
      background: var(--btn-gray-hover);
      color: #0f172a;
      transform: translateY(-1px);
    }

    .display-area {
      width: 100%;
      max-width: 460px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .empty-tip {
      color: #8c827a;
      font-size: 1.05rem;
    }

    #lotImg {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: none;
    }

    .save-hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #8c827a;
      display: none;
      text-align: center;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="lang-switch">
    <a href="en.html">English Version ↗</a>
  </div>

  <header>
    <h1>🪷 智慧籤 • 心靈法語 🪷</h1>
  </header>

  <div class="control-panel">
    <input type="number" id="lotInput" min="1" max="70" placeholder="1-70" />
    <!-- 查詢籤號為紅色按鈕 -->
    <button class="btn btn-search" onclick="handleQuery()">查詢籤號</button>
    <!-- 隨機抽籤為灰色按鈕 -->
    <button class="btn btn-draw" onclick="handleRandom()">隨機抽籤</button>
  </div>

  <div class="display-area">
    <div id="tip" class="empty-tip">請輸入籤號 (1–70) 或點擊「隨機抽籤」</div>
    <img id="lotImg" alt="智慧籤卡片" />
    <div id="saveHint" class="save-hint">提示：可長按圖片或截圖保存法語</div>
  </div>

  <script>
    const TOTAL_LOTS = 70;

    function renderLot(num) {
      if (num < 1 || num > TOTAL_LOTS || isNaN(num)) {
        alert("請輸入 1 至 " + TOTAL_LOTS + " 之間的有效籤號。");
        return;
      }

      const img = document.getElementById("lotImg");
      const tip = document.getElementById("tip");
      const hint = document.getElementById("saveHint");

      // 使用 .png 副檔名匹配倉庫中的圖片
      img.src = `images/${num}.png`;
      img.style.display = "block";
      tip.style.display = "none";
      hint.style.display = "block";

      // 觸發淡入動畫
      img.classList.remove("fade-in");
      void img.offsetWidth;
      img.classList.add("fade-in");
    }

    function handleQuery() {
      const val = parseInt(document.getElementById("lotInput").value, 10);
      renderLot(val);
    }

    function handleRandom() {
      const rand = Math.floor(Math.random() * TOTAL_LOTS) + 1;
      document.getElementById("lotInput").value = rand;
      renderLot(rand);
    }
  </script>
</body>
</html>
